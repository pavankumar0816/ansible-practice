- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform
    details:
      name: pavan
      age: 22
      city: TPG
    tasks:
    - frontend
    - backend
    - db 
  tasks:
  - name: print msg
    ansible.builtin.debug:
      msg: "Hi PMPK, {{ message | default('Good Morning')  }}"

  - name: convert string to list
    ansible.builtin.debug:
      # msg: "{{ topics.split(',')  }}"
      msg: "{{ topics | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ details | dict2items }}"

  - name: convert list to map
    ansible.builtin.debug:
      msg: "{{ tasks }}"
  

  