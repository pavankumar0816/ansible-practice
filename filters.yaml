- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform
  tasks:
  - name: print msg
    ansible.builtin.debug:
      msg: "Hi PMPK, {{ message | default('Good Morning')  }}"

  - name: split topics
    ansible.builtin.debug:
      msg: "{{ topics.split(',') }}"
  