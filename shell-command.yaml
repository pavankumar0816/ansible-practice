- name: shell vs command
  hosts: local
  connection: local
  tasks:
  - name: shell command
    # ansible.builtin.command: cat /etc/passwd | grep root
    ansible.builtin.shell: cat /etc/passwd | grep root
    register: user_output
  
  - name: print output
    ansible.builtin.debug:
      msg: "{{ user_output.stdout_lines }}"

  - name: test
    # ansible.builtin.command: ls -ltr > /tmp/files.txt
    ansible.builtin.shell: ls -ltr > /tmp/files.txt
    register: files_output
  
  - name: print files output
    ansible.builtin.debug:
      msg: "{{ files_output }}"